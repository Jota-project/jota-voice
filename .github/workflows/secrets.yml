name: secrets

# Escaneo de secretos con gitleaks (issue #57).
#
# Workflow propio y SIN cancel-in-progress: en tests.yml las ejecuciones de
# un push intermedio se cancelan al llegar otro, y con un rango
# before..sha sus commits se quedaban sin escanear. Aquí cada ejecución
# termina, y además el rango no depende de la ejecución anterior:
#   - pull_request:     base del PR..HEAD
#   - push a una rama:  origin/main..HEAD (todos los commits de la rama)
#   - push a main:      before..HEAD si `before` existe en el clon; si no
#                       (primer push, force-push), los últimos 50 commits.
# Lo ya publicado antes no se escanea entero: tiene hallazgos conocidos
# pendientes de rotar y reescribir, y bloquearía cada build.

on:
  push:
  pull_request:

concurrency:
  group: secrets-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks 8.21.2
        env:
          GL_VERSION: "8.21.2"
          GL_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tgz

      - name: Escanear
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --quiet origin main || true
          if [ "$EVENT" = "pull_request" ]; then
            LOG_OPTS="$PR_BASE..HEAD"
          elif [ "$REF" != "refs/heads/main" ] && git rev-parse -q --verify origin/main >/dev/null; then
            LOG_OPTS="origin/main..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            LOG_OPTS="$BEFORE..$HEAD_SHA"
          else
            LOG_OPTS="--max-count=50 $HEAD_SHA"
          fi
          echo "Rango escaneado: $LOG_OPTS"
          gitleaks git --redact --no-banner --verbose --log-opts="$LOG_OPTS" .
