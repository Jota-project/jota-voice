name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # macOS: es la plataforma de desarrollo, la única reproducible en local, y
    # ejecuta (en vez de saltar) los tests Cocoa/pyobjc del menubar.
    # Pendiente: job ubuntu-latest para cubrir el camino Linux.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            client/requirements.txt
            client/requirements-dev.txt
            requirements-macos.txt

      - name: Instalar portaudio (necesario para compilar pyaudio)
        run: brew install portaudio

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt -r requirements-macos.txt -r client/requirements-dev.txt

      - name: pytest
        working-directory: client
        # timeout global y asyncio_mode en client/pytest.ini
        run: python -m pytest -q

  shell:
    # Tests de los scripts de instalación (install/shared/tests/). Corren con
    # el /bin/sh del runner; ubuntu da dash, el sh más estricto de los que
    # ejecutan estos scripts (Termux también usa dash).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tests de shell
        run: |
          rc=0
          for t in install/shared/tests/test_*.sh; do
            echo "::group::$t"
            sh "$t" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  secrets:
    # Escaneo de secretos con gitleaks (issue #57) SOLO de los commits nuevos
    # de cada push/PR, para que lo ya publicado en el historial no bloquee
    # cada build.
    # Binario fijado con checksum (gitleaks-action v2 exige licencia en
    # repos de organización).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks 8.21.2
        env:
          GL_VERSION: "8.21.2"
          GL_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tgz

      - name: Escanear los commits nuevos
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..HEAD"
          elif [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$HEAD_SHA"
          else
            # Rama nueva (before = 000…) o force-push: lo que no está en main.
            git fetch --no-tags --quiet origin main || true
            if git rev-parse -q --verify origin/main >/dev/null \
               && [ "$(git rev-parse origin/main)" != "$HEAD_SHA" ]; then
              RANGE="origin/main..$HEAD_SHA"
            else
              RANGE="$HEAD_SHA~1..$HEAD_SHA"
            fi
          fi
          echo "Rango escaneado: $RANGE"
          gitleaks git --redact --no-banner --verbose --log-opts="$RANGE" .
