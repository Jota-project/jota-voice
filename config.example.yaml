gateway:
  # Opción A (recomendada para gateway detrás de proxy inverso / Tunnel):
  # una sola URL completa. Se respeta LITERAL — el cliente no añade
  # scheme, puerto ni path. Esto cubre el caso típico "wss://host/ruta"
  # donde el usuario no quiere que se inyecte ningún puerto.
  url: "wss://CHANGE-ME.example.com/api/gateway/ws/stream"
  # Opción B: host + (port opcional) + (path opcional) + (scheme opcional).
  # Si omites 'port', NO se añade a la URL. Si omites 'path', NO se añade.
  # Si omites 'scheme', default = "ws". Usa esto cuando hablas directo
  # con el gateway en LAN o en un puerto propio.
  # host: "CHANGE-ME.local"
  # port: 8004
  # path: "/ws/stream"
  # scheme: "ws"
  client_key: "RELLENAR"
  connect_timeout_s: 10
  # Issue #24: arquitectura de sesión. true (default) → una sola conexión
  # WebSocket persistente por proceso, handshake al arranque. false →
  # reconexión por turno (código previo, red de seguridad).
  persistent_session: true
  # Issue #118: reconexión automática de la sesión persistente. Espera antes
  # de cada reintento; el último valor se repite (backoff con máximo) y se
  # reinicia al recibir `ready`. Tras un cierre 1000 (inactividad) se
  # reabre al instante. Un rechazo 1008 (client_key inválida, agente no
  # permitido) NO se reintenta solo: se muestra el error y se vuelve a
  # intentar al empezar el siguiente turno.
  reconnect_backoff_s: [1, 2, 5, 10, 30]
  # Issues #116/#118: el gateway cierra la sesión tras 300 s sin recibir
  # NINGÚN mensaje del cliente (IDLE_TIMEOUT_S). En reposo se manda un
  # keepalive de aplicación ({"type":"keepalive"}, que el gateway ignora)
  # si el cliente lleva este tiempo sin enviar nada. 0 = desactivado (la
  # sesión caerá cada 5 min de silencio y se reabrirá sola).
  keepalive_interval_s: 120
  # Ping de protocolo de la librería websockets: detecta un gateway o una
  # red muertos. No cuenta como actividad para IDLE_TIMEOUT_S. 0 = sin ping.
  ping_interval_s: 20
  ping_timeout_s: 20

device:
  id: "mi-dispositivo"

oww:
  backend: "wyoming"          # único backend en fase 1
  host: "127.0.0.1"           # localhost en Mac y en Termux
  port: 10401
  wake_words:
    - "ok_nabu"
  reconnect_backoff_s: [5, 10, 20, 60]
  debounce_s: 2.0              # ignora detecciones repetidas de la misma wake
                                # word dentro de esta ventana (wyoming-openwakeword
                                # dispara una detección por cada chunk de audio por
                                # encima del threshold, no una por locución)

audio:
  backend: null               # null = auto-detect por SO
  sample_rate: 16000
  channels: 1
  frames_per_buffer: 512
  preroll_seconds: 1.5
  silence_timeout_s: 1.5
  recording_timeout_s: 15.0
  vad_rms_threshold: 200
  input_device: null          # solo sounddevice
  output_device: null         # solo sounddevice

display:
  # Kiosk de jota-display (Termux): se queda en "http" hasta que jota-display
  # migre al protocolo WebSocket (docs/display-protocol.md).
  # En macOS/Linux usa backend: "ws" (o quita url y deja backend: null para
  # elegir por plataforma: ws en macOS/Linux, http en Termux).
  backend: "http"              # "ws" | "http" | "null" | null (por plataforma)
  url: "http://127.0.0.1:8766" # solo http: POST /state del kiosk
  timeout_s: 2.0               # solo http
  # --- solo backend ws ---
  # port: 8767                  # 8766 es del kiosk; 8765 era el ControlServer (eliminado)
  # token_path: null            # null = ~/.jota-voice/display_token (se autogenera, chmod 600)
  # rate_limit_max_requests: 10 # handshakes con token inválido por ventana antes de 429
  # rate_limit_window_s: 10.0
  # max_clients: 8              # displays conectados a la vez

hosts:
  - ip: "192.168.X.X"
    name: "mi-servidor"
  - ip: "192.168.X.X"
    name: "mi-asistente"

logging:
  level: "INFO"

# menubar:
#   enabled: true                # false desactiva el UI nativo (macOS)
#   refresh_hz: 5.0               # Frecuencia del repaint; clamp [1.0, 30.0]
#   log_path: null                # null = ~/Library/Logs/jota-voice/stdout.log
#   config_path: null             # null = ~/Library/Application Support/jota-voice/config.yaml
#
# Equivalente: export JOTA_DISABLE_MENUBAR=1 antes de arrancar el cliente.
