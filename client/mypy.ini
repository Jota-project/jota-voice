# Typecheck del cliente (issue #74). Se ejecuta desde client/:
#   python -m mypy
# y en CI con .github/workflows/typecheck.yml.
#
# Nivel inicial realista: no strict. Comprueba el cuerpo de las funciones
# anotadas y la coherencia de tipos entre módulos; los tests no entran (los
# tipos los fija el código de producción).
[mypy]
python_version = 3.12
# El cliente se ejecuta en macOS y Termux; fijar la plataforma hace que las
# ramas `sys.platform` se comprueben igual en local y en CI (ubuntu).
platform = darwin
# Los módulos se importan como raíces de client/ (`from config import …`,
# `from backends …`), no como paquete `client.`.
mypy_path = .
explicit_package_bases = True
files = .
exclude = (?x)(
    ^tests/
  | ^build/
  )
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
pretty = False

# --- Dependencias sin stubs (o que CI no instala) -----------------------
# pyobjc (AppKit/Foundation/PyObjCTools), pyaudio y sounddevice no publican
# tipos; CI tampoco los instala (pyaudio exige portaudio y pyobjc solo existe
# en macOS). Sus objetos quedan como Any.
[mypy-AppKit,Foundation,PyObjCTools,pyaudio,sounddevice]
ignore_missing_imports = True

# --- Pendiente: ficheros de audio de otro bloque de trabajo ---------------
# Errores reales a corregir en un PR aparte (Fase 8b dejó estos módulos fuera
# de su alcance para no pisar el trabajo en curso sobre audio). Se desactivan
# SOLO los códigos que fallan hoy; cualquier error de otro tipo en estos
# ficheros sigue rompiendo el typecheck. Al corregirlos, borrar la sección
# (warn_unused_ignores no aplica aquí: comprobar con `python -m mypy`).
#
# backends/audio_sounddevice.py:
#   156-157 [union-attr]  self._capture_q / self._oww_q son
#           `Queue[bytes] | None` y el callback hace put_nowait sin
#           comprobar None.
#   192     [attr-defined] el stream de salida se infiere como None
#           (`self._output_stream = None` sin anotar) y luego se llama a .start().
[mypy-backends.audio_sounddevice]
disable_error_code = union-attr, attr-defined

# platforms/termux/audio_capture_termux.py:
#   183     [union-attr]  self._proc (`Popen | None`) y proc.stdout
#           (`IO | None`) se usan sin comprobar None en el hilo lector.
#   207-208 [union-attr]  colas `Queue[bytes] | None` con put_nowait sin
#           comprobar None.
[mypy-platforms.termux.audio_capture_termux]
disable_error_code = union-attr
