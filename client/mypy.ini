# Typecheck del cliente (issue #74). Se ejecuta desde client/:
#   python -m mypy
# y en CI con .github/workflows/typecheck.yml.
#
# Nivel inicial realista: no strict. Comprueba el cuerpo de las funciones
# anotadas y la coherencia de tipos entre módulos; los tests no entran (los
# tipos los fija el código de producción).
[mypy]
python_version = 3.12
# El cliente se ejecuta en macOS y Termux; fijar la plataforma hace que las
# ramas `sys.platform` se comprueben igual en local y en CI (ubuntu).
platform = darwin
# Los módulos se importan como raíces de client/ (`from config import …`,
# `from backends …`), no como paquete `client.`.
mypy_path = .
explicit_package_bases = True
files = .
exclude = (?x)(
    ^tests/
  | ^build/
  )
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
pretty = False

# --- Dependencias sin stubs (o que CI no instala) -----------------------
# pyobjc (AppKit/Foundation/PyObjCTools), pyaudio y sounddevice no publican
# tipos; CI tampoco los instala (pyaudio exige portaudio y pyobjc solo existe
# en macOS). Sus objetos quedan como Any.
[mypy-AppKit,Foundation,PyObjCTools,pyaudio,sounddevice]
ignore_missing_imports = True
