[pytest]
testpaths = tests
# Red de seguridad global (issue #40): un await que no resuelve nunca aborta
# el test en vez de colgar la suite. Los wait_for internos de cada test siguen
# siendo la primera línea; esto solo evita cuelgues indefinidos.
# timeout_method=thread porque los tests mezclan hilos (menubar, audio) con
# asyncio y el método signal no puede interrumpir esos casos.
timeout = 30
timeout_method = thread
# strict es el default de pytest-asyncio 1.x; explícito para no depender de él.
asyncio_mode = strict
